<h1>Készleten lévő hangszerek</h1>

<button class="btn btn-custom mt-5" data-bs-toggle="modal" data-bs-target="#addInstrumentModal">
  Új hangszer
</button>

<table class="instrument-table">
  <thead>
    <tr>
      <th>ID</th>
      <th>Név</th>
      <th>Típus</th>
      <th>Cikkszám</th>
      <th>Ár</th>
      <th>Kategória</th>
    </tr>
  </thead>

  <tbody>
    <tr *ngFor="let instrument of instruments">
      <td>{{ instrument.id }}</td>
      <td>{{ instrument.name }}</td>
      <td>{{ instrument.type }}</td>
      <td>{{ instrument.itemNumber }}</td>
      <td>{{ instrument.price }} Ft</td>
      <td>{{ instrument.category }}</td>
    </tr>
  </tbody>
</table>

<div class="modal fade" id="addInstrumentModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">

      <div class="modal-header">
        <h5 class="modal-title">Új hangszer hozzáadása</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>

      <div class="modal-body">

        <input class="form-control mb-2" placeholder="Név" [(ngModel)]="newInstrument.name">
        <input class="form-control mb-2" placeholder="Típus" [(ngModel)]="newInstrument.type">
        <input class="form-control mb-2" placeholder="Cikkszám" type="number" [(ngModel)]="newInstrument.itemNumber">
        <input class="form-control mb-2" placeholder="Ár" type="number" [(ngModel)]="newInstrument.price">
        <input class="form-control mb-2" placeholder="Kategória" [(ngModel)]="newInstrument.category">

      </div>

      <div class="modal-footer">
        <button class="btn btn-light" data-bs-dismiss="modal">Mégse</button>
        <button class="btn btn-custom" (click)="addInstrument()" data-bs-dismiss="modal">Mentés</button>
      </div>
    </div>
  </div>
</div>
